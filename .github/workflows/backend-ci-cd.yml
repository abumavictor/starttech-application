name: Backend CI/CD

on:
  push:
    branches: [ "master" ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'backend/**'
  workflow_dispatch: {}

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/MuchToDo

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Install dependencies
      run: go mod download

    - name: Run tests
      run: go test ./...

    - name: Run vulnerability scan
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...
      continue-on-error: true

  build-and-deploy:
    name: Build and Deploy Backend
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    defaults:
      run:
        working-directory: backend/MuchToDo

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build Docker image
      run: |
        docker build -t starttech-backend .

    - name: Tag and push to ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: starttech-backend
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker tag starttech-backend $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker tag starttech-backend $ECR_REGISTRY/$ECR_REPOSITORY:latest
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

    - name: Deploy to EC2 via SSM
      env:
        IMAGE_TAG: ${{ github.sha }}
      run: |
        aws ssm send-command \
          --targets "Key=tag:Name,Values=starttech-backend" \
          --document-name "AWS-RunShellScript" \
          --parameters commands=[
            "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}",
            "docker pull ${{ secrets.ECR_REGISTRY }}/starttech-backend:$IMAGE_TAG",
            "docker stop starttech-backend || true",
            "docker rm starttech-backend || true",
            "docker run -d --name starttech-backend -p 80:8080 ${{ secrets.ECR_REGISTRY }}/starttech-backend:$IMAGE_TAG"
          ]

    - name: Run smoke test
      run: |
        sleep 30
        aws elbv2 describe-target-health \
          --target-group-arn ${{ secrets.TARGET_GROUP_ARN }}
